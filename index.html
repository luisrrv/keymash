<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A keyboard toy for very small humans: press a letter or number to see and hear it." />
    <meta name="theme-color" content="#f6f1ea" />
    <title>keymash</title>
  </head>
  <body>
    <main id="start" class="start">
      <h1>keymash</h1>
      <p class="tagline">a keyboard toy for very small humans</p>
      <button id="start-button" type="button">start</button>
      <p class="hint">Turn the sound on, press start, then hand over the keyboard. To stop, hold Esc for 2 seconds.</p>
    </main>
    <main id="stage" class="stage" tabindex="-1" aria-live="polite" hidden></main>
    <p id="exit-hint" class="exit-hint" aria-hidden="true">parent mode: hold ESC to exit</p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
